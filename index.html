<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코리안타운 DB - 기억의 복원</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                        serif: ['"Noto Serif KR"', 'serif'],
                    },
                    colors: {
                        primary: '#1e3a8a', 
                        secondary: '#b45309', 
                        bgLight: '#f8fafc',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #f8fafc; overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .leaflet-popup-content-wrapper { border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .leaflet-popup-content { margin: 16px; font-family: 'Noto Sans KR', sans-serif; }
        .custom-popup .title { font-family: 'Noto Serif KR', serif; font-size: 1.125rem; font-weight: 700; color: #1e3a8a; margin-bottom: 4px; }
        .custom-popup .meta { font-size: 0.75rem; color: #64748b; margin-bottom: 8px; }
        .custom-popup .desc { font-size: 0.875rem; color: #334155; line-height: 1.4; }
        
        /* 선택된 마을 네트워크 하이라이트 효과 */
        .selected-card {
            border-color: #1e3a8a !important;
            background-color: #eff6ff !important;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.15) !important;
        }
        .network-child-card {
            border-color: #cbd5e1 !important;
            background-color: #f8fafc !important;
            opacity: 0.9;
            margin-left: 1.5rem !important;
            border-left: 4px solid #b45309 !important;
        }
    </style>
</head>

<body class="h-screen flex flex-col text-slate-800">

    <header class="bg-white border-b border-slate-200 shadow-sm z-20 relative flex-shrink-0">
        <div class="px-4 py-3 flex justify-between items-center max-w-full">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-earth-asia text-primary text-2xl"></i>
                <div>
                    <h1 class="font-serif text-xl font-bold text-primary leading-tight">코리안타운 DB</h1>
                    <p class="text-xs text-slate-500 tracking-wider">기억의 복원 : 사라진 한인 마을을 지도 위에</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4 hidden sm:flex">
                <div class="text-xs text-right bg-slate-100 p-2 rounded-md border border-slate-200">
                    <span class="block font-bold text-slate-600 mb-1"><i class="fa-solid fa-users mr-1"></i> 연구팀</span>
                    <span class="text-slate-500">김슬기, 박영훈, 송영화</span>
                </div>
                <button id="syncBtn" onclick="syncData()" class="bg-green-600 hover:bg-green-700 text-white text-sm font-medium py-2 px-4 rounded-md transition duration-200 flex items-center gap-2 shadow-sm">
                    <i class="fa-brands fa-google"></i> 실시간 동기화
                </button>
                <button onclick="toggleAIChat()" class="bg-purple-600 hover:bg-purple-700 text-white text-sm font-medium py-2 px-4 rounded-md transition duration-200 flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> AI 보조원
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <aside class="w-full md:w-96 bg-white border-r border-slate-200 flex flex-col z-10 shadow-[4px_0_15px_-3px_rgba(0,0,0,0.1)] h-[40vh] md:h-full">
            
            <div class="p-4 border-b border-slate-100 bg-slate-50">
                <div class="relative mb-3">
                    <input type="text" id="searchInput" placeholder="이름, 지역, 설명으로 검색..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow">
                    <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-400"></i>
                </div>
                
                <div class="flex gap-2 text-xs font-medium" id="filterContainer">
                    <button class="filter-btn active px-3 py-1.5 rounded-full border border-primary bg-primary text-white transition-colors" data-type="all">전체보기</button>
                    <button class="filter-btn px-3 py-1.5 rounded-full border border-slate-300 bg-white text-slate-600 hover:bg-slate-100 transition-colors" data-type="마을">
                        <i class="fa-solid fa-house text-orange-600 mr-1"></i> 마을
                    </button>
                    <button class="filter-btn px-3 py-1.5 rounded-full border border-slate-300 bg-white text-slate-600 hover:bg-slate-100 transition-colors" data-type="조직">
                        <i class="fa-solid fa-users text-blue-600 mr-1"></i> 조직
                    </button>
                    <button class="filter-btn px-3 py-1.5 rounded-full border border-slate-300 bg-white text-slate-600 hover:bg-slate-100 transition-colors" data-type="인물">
                        <i class="fa-solid fa-user text-green-600 mr-1"></i> 인물
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-2" id="dataList">
                <div class="p-8 text-center text-slate-400 text-sm flex flex-col gap-2 justify-center items-center h-full">
                    <i class="fa-solid fa-circle-notch fa-spin text-xl text-primary"></i>
                    구글 시트 데이터를 불러오는 중...
                </div>
            </div>
            
            <div class="p-2 border-t border-slate-200 bg-slate-50 text-xs text-slate-500 flex justify-between items-center">
                <span id="resultCount">총 0건</span>
                <span>DB v1.0 (Phase 1)</span>
            </div>
        </aside>

        <div id="map" class="flex-1 h-[60vh] md:h-full z-0"></div>
        
    </main>

    <div id="aiChatPanel" class="fixed right-0 top-0 h-full w-full sm:w-96 bg-white shadow-[-10px_0_20px_rgba(0,0,0,0.1)] transform translate-x-full transition-transform duration-300 z-[1000] flex flex-col border-l border-slate-200">
        <div class="px-4 py-3 bg-purple-600 text-white flex justify-between items-center shadow-sm z-10">
            <div class="flex items-center gap-2 font-bold">
                <i class="fa-solid fa-robot"></i>
                <span>AI 연구 보조원</span>
            </div>
            <button onclick="toggleAIChat()" class="hover:bg-purple-700 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div id="chatBody" class="flex-1 overflow-y-auto p-4 bg-slate-50 flex flex-col scroll-smooth"></div>

        <div class="p-3 border-t border-slate-200 bg-white">
            <div class="relative">
                <input type="text" id="chatInput" onkeypress="handleChatSubmit(event)" placeholder="역사적 배경이나 추가 정보를 물어보세요..." class="w-full pl-4 pr-12 py-3 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-shadow bg-slate-50">
                <button onclick="handleChatSubmit()" class="absolute right-2 top-2 w-8 h-8 bg-purple-100 text-purple-600 hover:bg-purple-600 hover:text-white rounded flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </div>
            <div class="text-[10px] text-center text-slate-400 mt-2">
                Gemini AI가 제공하는 정보는 참고용으로 교차 검증이 필요합니다.
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="./env-config.js"></script>

    <script>
        let rawData = [];
        let map;
        let markers = [];
        let currentFilter = 'all';
        let currentSearch = '';
        let chatHistory = [];
        let isChatOpen = false;
        let selectedTownName = null; // 현재 네트워크 하이라이트 중인 마을 이름

        const geminiApiKey = window.APP_CONFIG?.geminiApiKey || '';

        function csvToArray(text) {
            let p = '', c = '', r = [];
            let q = false;
            let row = [''];
            for (let i = 0; i < text.length; i++) {
                c = text[i];
                let next = text[i + 1];
                if (c === '"') {
                    if (q && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { q = !q; }
                } else if (c === ',') {
                    if (q) { row[row.length - 1] += c; }
                    else { row.push(''); }
                } else if (c === '\r' || c === '\n') {
                    if (c === '\r' && next === '\n') { i++; }
                    if (q) { row[row.length - 1] += c; }
                    else {
                        r.push(row);
                        row = [''];
                    }
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') {
                r.push(row);
            }
            return r;
        }

        async function loadGoogleSheetsData() {
            const spreadsheetId = window.APP_CONFIG?.spreadsheetId || '';
            if (!spreadsheetId) return;
            
            const baseUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv`;
            const targets = [
                { type: '마을', gid: '0' },
                { type: '조직', gid: '1633831664' },
                { type: '인물', gid: '997795861' }
            ];
            
            let globalId = 1;
            const updatedData = [];
            const townCoords = {}; // 마을 위치 임시 저장소 (종속성 해결용)

            // 1단계: '마을' 데이터 먼저 파싱하여 확실하게 숫자형 좌표 확보
            try {
                const townTarget = targets.find(t => t.type === '마을');
                const response = await fetch(`${baseUrl}&gid=${townTarget.gid}`);
                if (response.ok) {
                    const records = csvToArray(await response.text());
                    for (let i = 1; i < records.length; i++) {
                        const row = records[i];
                        if (!row[0] || row[0].trim() === '') continue;

                        const name = row[0].trim();
                        // 💡 반드시 확실한 숫자형(Float)으로 변환하여 저장
                        const lat = row[5] ? parseFloat(row[5].trim()) : 0;
                        const lng = row[6] ? parseFloat(row[6].trim()) : 0;

                        if (!isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
                            townCoords[name] = { lat: lat, lng: lng };
                        }

                        let desc = row[1] ? row[1].trim() : '';
                        if (row[2] && row[2].trim()) desc = `[인구: ${row[2].trim()}] ` + desc;

                        updatedData.push({
                            id: globalId++,
                            type: '마을',
                            name: name,
                            description: desc,
                            founded: row[3] ? row[3].trim() : '',
                            dissolved: row[4] ? row[4].trim() : '',
                            lat: lat,
                            lng: lng,
                            source: row[7] ? row[7].trim() : '',
                            author: row[8] ? row[8].trim() : '',
                            relatedTown: '',
                            relatedOrg: ''
                        });
                    }
                }
            } catch (e) { console.error("마을 파싱 실패", e); }

            // 2단계: '조직' 및 '인물' 데이터 파싱 및 위치 종속 처리 보강
            for (const target of targets) {
                if (target.type === '마을') continue;
                try {
                    const response = await fetch(`${baseUrl}&gid=${target.gid}`);
                    if (!response.ok) continue;
                    
                    const records = csvToArray(await response.text());
                    for (let i = 1; i < records.length; i++) {
                        const row = records[i];
                        if (!row[0] || row[0].trim() === '') continue;

                        let item = {
                            id: globalId++,
                            type: target.type,
                            name: row[0].trim(),
                            description: row[1] ? row[1].trim() : '',
                            founded: row[2] ? row[2].trim() : '',
                            dissolved: row[3] ? row[3].trim() : '',
                            lat: 0,
                            lng: 0,
                            relatedTown: row[4] ? row[4].trim() : '',
                            relatedOrg: '',
                            source: '',
                            author: ''
                        };

                        if (target.type === '조직') {
                            item.source = row[5] ? row[5].trim() : '';
                            item.author = row[6] ? row[6].trim() : '';
                        } else if (target.type === '인물') {
                            item.relatedOrg = row[5] ? row[5].trim() : '';
                            item.source = row[6] ? row[6].trim() : '';
                            item.author = row[7] ? row[7].trim() : '';
                        }

                        // 💡 핵심 수정: 부모 마을의 실수형(Float) 좌표를 안전하게 상속받음
                        if (item.relatedTown && townCoords[item.relatedTown]) {
                            item.lat = townCoords[item.relatedTown].lat;
                            item.lng = townCoords[item.relatedTown].lng;
                        }
                        
                        updatedData.push(item);
                    }
                } catch (error) { console.error(`${target.type} 파싱 실패`, error); }
            }
            rawData = updatedData;
        }

        async function fetchLatestAndRender() {
            await loadGoogleSheetsData();
            renderData();
        }

        async function syncData() {
            const btn = document.getElementById('syncBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> 동기화 중...`;
            try {
                await fetchLatestAndRender();
                alert('구글 스프레드시트 최신 데이터 및 위치 종속 관계가 반영되었습니다.');
            } catch (err) {
                alert('동기화에 실패했습니다.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-brands fa-google"></i> 실시간 동기화`;
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            map = L.map('map').setView([43.0, 132.0], 5); // 연해주 일대가 잘 보이도록 기본 뷰 조정
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 18, minZoom: 2
            }).addTo(map);

            document.getElementById('searchInput').addEventListener('input', handleSearch);
            const filterBtns = document.querySelectorAll('.filter-btn');
            filterBtns.forEach(btn => {
                btn.addEventListener('click', (e) => handleFilter(e, filterBtns));
            });

            await fetchLatestAndRender();
            setInterval(fetchLatestAndRender, 30000);
        });

        function getIcon(type, isHighlighted = false) {
            let color, iconClass;
            if (type === '마을') { color = '#ea580c'; iconClass = 'fa-house'; } 
            else if (type === '조직') { color = '#2563eb'; iconClass = 'fa-users'; } 
            else if (type === '인물') { color = '#16a34a'; iconClass = 'fa-user'; }

            // 하이라이트(네트워크 선택) 시 마커 크기와 가시성 증폭
            const size = isHighlighted ? '36px' : '28px';
            const border = isHighlighted ? '3px solid #ff0000' : '2px solid white';
            const shadow = isHighlighted ? '0 0 12px rgba(255,0,0,0.8)' : '0 2px 5px rgba(0,0,0,0.3)';

            const html = `
                <div style="background-color: ${color}; width: ${size}; height: ${size}; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: ${border}; box-shadow: ${shadow}; transition: all 0.3s;" class="text-white text-xs">
                    <i class="fa-solid ${iconClass}"></i>
                </div>
            `;
            return L.divIcon({
                html: html, className: '', iconSize: [40, 40], iconAnchor: [20, 20], popupAnchor: [0, -20]
            });
        }

        function getFilteredData() {
            return rawData.filter(item => {
                const matchType = currentFilter === 'all' || item.type === currentFilter;
                const matchSearch = item.name.toLowerCase().includes(currentSearch) || 
                                    item.description.toLowerCase().includes(currentSearch) ||
                                    (item.relatedTown && item.relatedTown.toLowerCase().includes(currentSearch));
                return matchType && matchSearch;
            });
        }

        function renderData() {
            // 1. 순수 검색/필터 결과 분리
            const filteredData = getFilteredData();
            const listContainer = document.getElementById('dataList');
            listContainer.innerHTML = '';
            
            if (filteredData.length === 0) {
                listContainer.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">데이터가 없습니다.</div>`;
                // 검색 결과가 없을 때 기존 지도 마커도 깨끗이 지워줍니다.
                markers.forEach(m => map.removeLayer(m));
                markers = [];
                return;
            }

            // 사이드바 전용 정렬 트리 조립
            let displayData = [...filteredData];
            if (selectedTownName && currentFilter === 'all') {
                const townItem = rawData.find(d => d.type === '마을' && d.name === selectedTownName);
                const children = rawData.filter(d => d.type !== '마을' && d.relatedTown === selectedTownName);
                
                displayData = displayData.filter(d => d.name !== selectedTownName && d.relatedTown !== selectedTownName);
                if (townItem) displayData.unshift(townItem, ...children);
            }

            // 사이드바 UI 출력
            displayData.forEach(item => {
                let badgeColor = '';
                let isChild = false;

                if (item.type === '마을') badgeColor = 'bg-orange-100 text-orange-800 border-orange-200';
                else if (item.type === '조직') badgeColor = 'bg-blue-100 text-blue-800 border-blue-200';
                else if (item.type === '인물') badgeColor = 'bg-green-100 text-green-800 border-green-200';

                if (selectedTownName && item.type !== '마을' && item.relatedTown === selectedTownName) {
                    isChild = true;
                }

                const card = document.createElement('div');
                card.className = `p-3 mb-2 bg-white border border-slate-200 rounded-lg shadow-sm hover:shadow-md hover:border-primary cursor-pointer transition-all ${item.name === selectedTownName ? 'selected-card' : ''} ${isChild ? 'network-child-card' : ''}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <h3 class="font-bold text-slate-800 font-serif ${isChild ? 'text-base' : 'text-lg'}">
                            ${isChild ? '<i class="fa-solid fa-arrow-turn-up rotate-90 mr-1 text-slate-400"></i>' : ''}${item.name}
                        </h3>
                        <span class="text-[10px] px-2 py-0.5 rounded-full border font-medium ${badgeColor}">${item.type}</span>
                    </div>
                    <p class="text-xs text-slate-500 mb-2 line-clamp-2">${item.description}</p>
                    ${item.relatedTown ? `<div class="text-[10px] text-primary font-medium mb-1"><i class="fa-solid fa-link"></i> 소속마을: ${item.relatedTown}</div>` : ''}
                    <div class="flex justify-between items-end text-[10px] text-slate-400">
                        <span><i class="fa-regular fa-clock"></i> ${item.founded || '미상'} ~ ${item.dissolved || '미상'}</span>
                        <button onclick="event.stopPropagation(); askAIAboutById(${item.id})" class="text-purple-600 hover:text-purple-800 hover:bg-purple-100 transition-colors bg-purple-50 px-1.5 py-0.5 rounded border border-purple-200">
                            <i class="fa-solid fa-sparkles"></i> AI 해설
                        </button>
                    </div>
                `;
                
                card.onclick = () => focusOnMap(item);
                listContainer.appendChild(card);
            });

            document.getElementById('resultCount').innerText = `총 ${filteredData.length}건`;

            // 2. 💡 지도 마커 렌더링 시스템 전면 수정
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            filteredData.forEach(item => {
                const lat = parseFloat(item.lat);
                const lng = parseFloat(item.lng);
                if (isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0) return;

                // 마커 하이라이트 활성화 조건 설정
                const isHighlighted = selectedTownName && (item.name === selectedTownName || item.relatedTown === selectedTownName);

                try {
                    const marker = L.marker([lat, lng], { icon: getIcon(item.type, isHighlighted) }).addTo(map);
                    
                    // 💡 마을 노드이거나 종속 노드일 때 툴팁에 유기적 관계망 텍스트 빌드
                    let relationsHtml = '';
                    const targetTown = item.type === '마을' ? item.name : item.relatedTown;
                    
                    if (targetTown) {
                        const subOrgs = rawData.filter(d => d.type === '조직' && d.relatedTown === targetTown).map(d => d.name).join(', ');
                        const subPers = rawData.filter(d => d.type === '인물' && d.relatedTown === targetTown).map(d => d.name).join(', ');
                        if (subOrgs) relationsHtml += `<div class="text-[11px] text-blue-700 mt-1"><b>🏡 관련 조직:</b> ${subOrgs}</div>`;
                        if (subPers) relationsHtml += `<div class="text-[11px] text-green-700"><b>👤 관련 인물:</b> ${subPers}</div>`;
                    }

                    const popupContent = `
                        <div class="custom-popup w-64">
                            <div class="text-[10px] text-slate-500 mb-1">${item.type} ${item.relatedTown ? `(소속: ${item.relatedTown})` : ''}</div>
                            <div class="title">${item.name}</div>
                            <div class="meta"><i class="fa-regular fa-clock"></i> ${item.founded || '미상'} ~ ${item.dissolved || '미상'}</div>
                            <div class="desc mb-2">${item.description}</div>
                            ${relationsHtml}
                            <div class="text-[10px] text-slate-400 border-t pt-2 mt-2 flex justify-between items-end gap-2">
                                <div>
                                    <strong>출처:</strong> ${item.source || '자체조사'}<br>
                                    <strong>작성자:</strong> ${item.author || '연구팀'}
                                </div>
                                <button onclick="askAIAboutById(${item.id})" class="bg-purple-50 text-purple-700 hover:bg-purple-100 px-2 py-1.5 rounded text-[10px] border border-purple-200 transition-colors flex-shrink-0">
                                    <i class="fa-solid fa-wand-magic-sparkles"></i> AI 해설
                                </button>
                            </div>
                        </div>
                    `;
                    
                    marker.bindPopup(popupContent);
                    marker.itemId = item.id;

                    // 마커 누를 때 다른 마커 안 날아가게 우회 팝업 동기화
                    marker.on('click', function() {
                        if (item.type === '마을') {
                            selectedTownName = item.name;
                        } else if (item.relatedTown) {
                            selectedTownName = item.relatedTown;
                        }

                        setTimeout(() => {
                            renderData();
                            const currentTarget = markers.find(m => m.itemId === item.id);
                            if (currentTarget) currentTarget.openPopup();
                        }, 80);
                    });

                    markers.push(marker);
                } catch (e) { console.error("마커 생성 도중 에러:", e); }
            });
        }

        function focusOnMap(item) {
            const lat = parseFloat(item.lat);
            const lng = parseFloat(item.lng);
            if (isNaN(lat) || isNaN(lng)) return;

            if (window.innerWidth < 768) {
                document.getElementById('map').scrollIntoView({behavior: 'smooth'});
            }

            // 네트워크 상태 업데이트
            if (item.type === '마을') {
                selectedTownName = item.name;
            } else if (item.relatedTown) {
                selectedTownName = item.relatedTown;
            }

            // 하이라이트 스타일을 전체 갱신하기 위해 먼저 한 번 그림
            renderData();

            map.setView([lat, lng], 7, { animate: true, duration: 1 });

            // 정확한 타겟 마커 팝업 열기
            const targetMarker = markers.find(m => m.itemId === item.id);
            if (targetMarker) {
                setTimeout(() => { targetMarker.openPopup(); }, 300);
            }
        }

        function handleSearch(e) {
            currentSearch = e.target.value.toLowerCase();
            if(!currentSearch) selectedTownName = null;
            renderData();
        }

        function handleFilter(e, allBtns) {
            allBtns.forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white', 'active');
                btn.classList.add('bg-white', 'text-slate-600');
            });
            e.currentTarget.classList.remove('bg-white', 'text-slate-600');
            e.currentTarget.classList.add('bg-primary', 'text-white', 'active');

            currentFilter = e.currentTarget.getAttribute('data-type');
            
            // 💡 핵심: 필터를 바꿀 때는 하이라이트 상태를 초기화하고 완벽히 지도를 새로 그립니다.
            selectedTownName = null; 
            renderData();
        }

        // --- Gemini AI 기능 (권장되는 최신 안정 모델 반영 및 403 예외처리 우회) ---
        function toggleAIChat() {
            const panel = document.getElementById('aiChatPanel');
            isChatOpen = !isChatOpen;
            if (isChatOpen) {
                panel.classList.remove('translate-x-full');
                if (chatHistory.length === 0) {
                    addMessageToUI('assistant', "안녕하세요! '코리안타운 DB' 연구 보조원입니다. 특정 마을을 클릭하시면 종속된 조직과 인물망을 한눈에 보실 수 있습니다. 궁금한 역사적 사실을 물어보세요!");
                }
            } else {
                panel.classList.add('translate-x-full');
            }
        }

        function askAIAboutById(id) {
            const item = rawData.find(d => d.id === id);
            if (!item) return;
            if (!isChatOpen) toggleAIChat();

            let relationContext = "";
            if (item.type === '마을') {
                const childOrgs = rawData.filter(d => d.type === '조직' && d.relatedTown === item.name).map(d => d.name);
                const childPers = rawData.filter(d => d.type === '인물' && d.relatedTown === item.name).map(d => d.name);
                relationContext = ` 이 마을에 종속된 독립운동 단체로는 [${childOrgs.join(', ')}] 등이 있으며, 활약한 인물로는 [${childPers.join(', ')}] 등이 연계되어 있어.`;
            } else if (item.relatedTown) {
                relationContext = ` 이 대상은 역사적으로 '${item.relatedTown}' 한인 마을 공간에 종속되어 활동했어.`;
            }

            const prompt = `'${item.name}'(${item.type})에 대해 학술적이고 역사적인 배경을 더 자세히 설명해 줘. (DB 기초 정보: ${item.description}). ${relationContext}`;
            addMessageToUI('user', `'${item.name}' 관계망에 대해 자세한 학술 해설을 부탁합니다.`);
            fetchGeminiResponse(prompt);
        }

        function handleChatSubmit(event) {
            if (event && event.type === 'keypress' && event.key !== 'Enter') return;
            const inputEl = document.getElementById('chatInput');
            const message = inputEl.value.trim();
            if (!message) return;
            inputEl.value = '';
            addMessageToUI('user', message);
            fetchGeminiResponse(message);
        }

        function parseSimpleMarkdown(text) {
            let html = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'); 
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>'); 
            html = html.replace(/\n/g, '<br>'); 
            return html;
        }

        function addMessageToUI(role, text) {
            const chatBody = document.getElementById('chatBody');
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-3 mb-4 ${role === 'user' ? 'flex-row-reverse' : ''}`;
            
            const avatarClass = role === 'user' ? 'bg-slate-200 text-slate-600' : 'bg-purple-100 text-purple-600 border border-purple-200';
            const avatarIcon = role === 'user' ? 'fa-user' : 'fa-robot';
            const bubbleClass = role === 'user' ? 'bg-primary text-white rounded-l-lg rounded-br-lg' : 'bg-slate-100 text-slate-800 rounded-r-lg rounded-bl-lg border border-slate-200';

            const parsedText = role === 'assistant' ? parseSimpleMarkdown(text) : text;

            msgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-sm ${avatarClass}">
                    <i class="fa-solid ${avatarIcon}"></i>
                </div>
                <div class="p-3 max-w-[75%] text-sm shadow-sm ${bubbleClass} leading-relaxed">
                    ${parsedText}
                </div>
            `;
            const loadingIndicator = document.getElementById('loadingIndicator');
            if (loadingIndicator && role !== 'loading') loadingIndicator.remove();
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function showLoading() {
            const chatBody = document.getElementById('chatBody');
            const msgDiv = document.createElement('div');
            msgDiv.id = 'loadingIndicator';
            msgDiv.className = `flex gap-3 mb-4`;
            msgDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center text-sm bg-purple-100 text-purple-600 border border-purple-200">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="p-3 bg-slate-100 text-slate-500 rounded-r-lg rounded-bl-lg border border-slate-200 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> 관계망 사료 교차 검증 중...
                </div>
            `;
            chatBody.appendChild(msgDiv);
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        async function fetchGeminiResponse(userMessage) {
            chatHistory.push({ role: "user", parts: [{ text: userMessage }] });
            showLoading();

            if (!geminiApiKey) {
                addMessageToUI('assistant', 'Gemini API 키가 설정되지 않았습니다. env-config.js를 확인하세요.');
                return;
            }

            const systemPrompt = `당신은 '코리안타운 DB - 기억의 복원' 프로젝트의 수석 역사학자이자 AI 연구원입니다. 사라진 한인 마을(공간), 독립운동 조직, 인물 간의 네트워크와 위상 관계를 설명합니다. 전체 데이터 정보: ${JSON.stringify(rawData)}. 질문에 사료적 근거와 학술적 맥락을 더해 풍성하게 답변하세요.`;
            const payload = {
                contents: chatHistory,
                systemInstruction: { parts: [{ text: systemPrompt }] },
            };

            // 💡 최신 안정화 모델(gemini-2.5-flash) 엔드포인트 반영
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiApiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if (result.candidates && result.candidates[0].content) {
                    const aiResponseText = result.candidates[0].content.parts[0].text;
                    chatHistory.push({ role: "model", parts: [{ text: aiResponseText }] });
                    addMessageToUI('assistant', aiResponseText);
                } else if(result.error && result.error.code === 403) {
                    addMessageToUI('assistant', "⚠️ <b>API 접근 권한 거부(403 Error)</b>: Google Cloud 콘솔의 'API 및 서비스 > 사용자 인증 정보'에서 사용 중인 API 키의 제한사항을 <b>'키 제한 안함'</b>으로 변경하거나, <b>'Generative Language API'</b>를 명시적으로 허용해 주셔야 해결됩니다.");
                } else {
                    addMessageToUI('assistant', "자료를 분석하는 중에 에러가 발생했습니다.");
                }
            } catch (error) {
                addMessageToUI('assistant', "네트워크 통신 오류가 발생했습니다.");
            }
        }
    </script>
</body>
</html>
